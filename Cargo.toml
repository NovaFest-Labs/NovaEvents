[package]
name = "nova-events"
version = "0.1.0"
edition = "2021"
publish = false
description = "Transparent event management on Stellar — sponsorship funding, multi-tier ticketing, and on-chain payouts, settled in USDC."
repository = "https://github.com/MOYIN-21/NovaEvents"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "26" }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
